plugins {
    id 'application'
}

group = 'studio.wave'
version = '0.1.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    implementation 'com.google.code.gson:gson:2.13.2'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'studio.wave.WaveStudio'
    applicationDefaultJvmArgs = ['-Dawt.useSystemAAFontSettings=on', '-Dswing.aatext=true']
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test) {
    useJUnitPlatform { excludeTags 'audio-integration', 'desktop' }
    systemProperty 'java.awt.headless', 'true'
}

tasks.register('audioIntegrationTest', Test) {
    description = 'Tests real PipeWire recording/routing with an isolated virtual audio device.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'audio-integration' }
    shouldRunAfter tasks.test
}

tasks.register('uiTest', Test) {
    description = 'Runs Swing interaction/layout checks on the current desktop.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'desktop' }
    systemProperty 'java.awt.headless', 'false'
    systemProperty 'wave.screenshots', layout.buildDirectory.dir('screenshots').get().asFile.absolutePath
    shouldRunAfter tasks.test
}

tasks.named('jar', Jar) {
    manifest { attributes 'Main-Class': application.mainClass.get() }
}

tasks.named('wrapper', Wrapper) {
    gradleVersion = '9.8.2'
    distributionType = Wrapper.DistributionType.BIN
    distributionSha256Sum = '21bd5da2de49b642904077f38c0efdc7778e92b3ed0889392dca61b97e389607'
}
